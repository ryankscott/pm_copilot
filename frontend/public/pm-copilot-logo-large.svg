  <!-- Document lines -->
  <line x1="10" y1="9" x2="18" y2="9" stroke="#6B7280" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="11.5" x2="16" y2="11.5" stroke="#6B7280" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="14" x2="18" y2="14" stroke="#6B7280" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="16.5" x2="15" y2="16.5" stroke="#6B7280" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- AI/Copilot star accent -->
  <g transform="translate(16, 3)">
